# Runs this repo's existing suite on every push and pull request.
# The suite was always here; nothing ran it but a person remembering to.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # --wait blocks on the healthcheck, which counts the seeded rows.
      - run: docker compose up -d --wait
      - run: python backend/test_plan_parser.py
      - run: python backend/test_app.py
